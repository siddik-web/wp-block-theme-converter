name: Skill CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate-skill:
    name: Validate skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run validate-skill.mjs
        run: node scripts/validate-skill.mjs

  validate-plugin:
    name: Validate plugin packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run validate-plugin.mjs
        run: node scripts/validate-plugin.mjs

  lint-scripts:
    name: Lint scripts (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check all .mjs scripts for syntax errors
        run: |
          for f in $(find scripts -name '*.mjs'); do
            echo "Checking $f"
            node --check "$f"
          done

  doctor-golden-theme:
    name: Doctor — golden theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Golden theme is in sync with templates/
        run: node scripts/build-golden-theme.mjs --check

      - name: Run doctor.mjs against golden theme
        run: node scripts/doctor.mjs examples/_generated/landing-page-theme

  test-scripts:
    name: Theme-check regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run node --test
        run: node --test scripts/tests/*.test.mjs

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2 "**/*.md" --ignore node_modules
