name: Skill CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate-skill:
    name: Validate skill structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run validate-skill.mjs
        run: node scripts/validate-skill.mjs

  validate-plugin:
    name: Validate plugin packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run validate-plugin.mjs
        run: node scripts/validate-plugin.mjs

  validate-evals:
    name: Validate eval suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run validate-evals.mjs
        run: node scripts/validate-evals.mjs

  claude-plugin-validate:
    name: claude plugin validate (official)
    runs-on: ubuntu-latest
    env:
      # Pinned so a CLI release can't change the result without a commit here.
      CLAUDE_CODE_VERSION: "2.1.308"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # the Claude Code CLI requires Node >= 22

      # No credentials needed: validate only reads the manifests on disk.
      - name: Validate plugin manifest
        run: npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate .claude-plugin/plugin.json --strict

      - name: Validate marketplace manifest
        run: npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate .claude-plugin/marketplace.json --strict

  lint-scripts:
    name: Lint scripts (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check all .mjs scripts for syntax errors
        run: |
          for f in $(find scripts -name '*.mjs'); do
            echo "Checking $f"
            node --check "$f"
          done

  doctor-golden-theme:
    name: Doctor — golden theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Golden theme is in sync with templates/
        run: node scripts/build-golden-theme.mjs --check

      - name: Run doctor.mjs against golden theme
        run: node scripts/doctor.mjs examples/_generated/landing-page-theme

      - name: Run doctor.mjs against the demo theme (generated by a real run)
        run: node scripts/doctor.mjs examples/demo/northstar-theme

  test-scripts:
    name: Theme-check regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run node --test
        run: node --test scripts/tests/*.test.mjs

  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint-cli2
        run: npx --yes markdownlint-cli2 "**/*.md" --ignore node_modules
